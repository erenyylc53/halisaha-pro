<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halı Saha Pro · Takım Dengeleme</title>
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="Halı saha maçları için yetenek, mevki ve kondisyona göre dengeli takım oluşturma platformu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d;--bg2:#101216;--card:#15181d;--card2:#1b1f26;--card3:#222731;
  --line:#272c35;--line2:#323946;--text:#eceff4;--muted:#8b94a5;--dim:#5d6676;
  --green:#3ddc84;--green2:#22b968;--greenGlow:rgba(61,220,132,.18);
  --blue:#3b82f6;--blue2:#1d4ed8;--red:#ef4444;--red2:#b91c1c;--amber:#f5b301;
  --radius:16px;--radius-sm:10px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --cond:'Barlow Condensed','Inter',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(61,220,132,.07),transparent 60%),
  radial-gradient(900px 500px at -10% 10%,rgba(59,130,246,.06),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--greenGlow)}
input[type=date],input[type=time]{color-scheme:dark}
.hidden{display:none!important}

/* Header */
header.top{position:sticky;top:0;z-index:40;background:rgba(10,11,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),#119a52);display:grid;place-items:center;box-shadow:0 6px 20px rgba(61,220,132,.25)}
.brand em{font-style:normal;color:var(--green)}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;transition:.15s}
nav.tabs a:hover{color:var(--text);background:var(--card)}
nav.tabs a.on{color:var(--text);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line2)}
nav.tabs a.on svg{color:var(--green)}
.sync{cursor:pointer;font:inherit;font-size:12px;margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px currentColor}
.sync.ok i{background:var(--green)}.sync.err i{background:var(--red)}
nav.bottom{display:none}

main{max-width:1320px;margin:0 auto;padding:22px 20px 120px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head h1{font-family:var(--cond);font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.view-head p{color:var(--muted);margin-top:6px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line2);transition:transform .1s,background .15s,border-color .15s,opacity .15s;white-space:nowrap;user-select:none}
.btn:hover{background:var(--card3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#45e58d,#22b968);border-color:transparent;color:#04130a;box-shadow:0 8px 24px rgba(61,220,132,.22)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#fca5a5}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.icon{padding:8px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{border-color:var(--green);color:var(--green);background:rgba(61,220,132,.08)}

.card{background:linear-gradient(180deg,var(--card),#13161a);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-family:var(--cond);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}

/* role badges */
.rb{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.4px;font-family:var(--font)}
.r-GK{background:rgba(245,179,1,.15);color:#fcd34d}
.r-DEF{background:rgba(59,130,246,.15);color:#93c5fd}
.r-MID{background:rgba(61,220,132,.14);color:#86efac}
.r-FWD{background:rgba(239,68,68,.15);color:#fca5a5}

/* Players */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{padding-left:38px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.toolbar select{width:auto}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--cond);font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:linear-gradient(180deg,var(--card),#121519);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,transform .15s;animation:fadeUp .35s both}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pc-top{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:18px;background:linear-gradient(135deg,#2a303b,#1a1e25);border:1px solid var(--line2);flex:none}
.pc-id{flex:1;min-width:0}
.pc-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-pos{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.ovr{text-align:center;flex:none}
.ovr b{display:block;font-family:var(--cond);font-size:32px;font-weight:800;line-height:.9;color:var(--green)}
.ovr small{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.8px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:30px 1fr 22px;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.bar .tr{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.bar b{color:var(--text);text-align:right;font-weight:700}
.pc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.pc-foot .row{gap:6px}
.opt-attrs{display:flex;gap:6px;flex-wrap:wrap}
.opt-attrs span{font-size:11px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.opt-attrs b{color:var(--text)}

/* Empty */
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted)}
.empty .ico{font-size:44px;margin-bottom:10px}
.empty h3{color:var(--text);font-family:var(--cond);font-size:24px;text-transform:uppercase;margin-bottom:6px}
.empty .btn{margin-top:16px}

/* Match */
.match-layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.match-side{position:sticky;top:84px;display:grid;gap:14px}
.counter{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:var(--green);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bg2) 0);position:relative;flex:none;transition:--p .4s}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-family:var(--cond);font-size:28px;font-weight:800;line-height:1;text-align:center}
.ring span small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.status{padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.status.ok{background:rgba(61,220,132,.1);color:#86efac;border:1px solid rgba(61,220,132,.25)}
.status.warn{background:rgba(245,179,1,.1);color:#fcd34d;border:1px solid rgba(245,179,1,.25)}
.status.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;user-select:none}
.prow:hover{border-color:var(--line2)}
.prow.sel{border-color:var(--green);background:linear-gradient(90deg,rgba(61,220,132,.12),var(--card) 70%)}
.cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:.15s}
.prow.sel .cbx{background:var(--green);border-color:var(--green);color:#04130a}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm div{display:flex;gap:3px;margin-top:4px}
.prow .sc{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--muted)}
.prow.sel .sc{color:var(--green)}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto}
.sel-chips span{font-size:12px;padding:4px 8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* Teams */
.team-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.teams-layout{display:grid;grid-template-columns:1fr minmax(360px,520px) 1fr;gap:18px;align-items:start}
.tcard{border-radius:var(--radius);border:1px solid var(--line);background:var(--card);overflow:hidden;animation:fadeUp .4s both}
.tcard .th{padding:16px 16px 14px;position:relative}
.tcard.A .th{background:linear-gradient(135deg,rgba(59,130,246,.28),rgba(59,130,246,.04))}
.tcard.B .th{background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(239,68,68,.04))}
.tcard .th::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.tcard.A .th::before{background:var(--blue)}.tcard.B .th::before{background:var(--red)}
.th-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.th h2{font-family:var(--cond);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.th .dot{width:12px;height:12px;border-radius:50%}
.A .dot{background:var(--blue);box-shadow:0 0 10px var(--blue)}.B .dot{background:var(--red);box-shadow:0 0 10px var(--red)}
.th .pwr{text-align:right}
.th .pwr b{font-family:var(--cond);font-size:34px;font-weight:800;line-height:.9;display:block}
.th .pwr small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.8px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.mini-stats div{background:rgba(0,0,0,.28);border-radius:10px;padding:7px 6px;text-align:center}
.mini-stats b{display:block;font-family:var(--cond);font-size:19px;font-weight:700;line-height:1.1}
.mini-stats span{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tlist{padding:6px}
.tp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .12s}
.tp:hover{background:var(--card2)}
.tp.swapsrc{background:rgba(245,179,1,.12);box-shadow:inset 0 0 0 1px rgba(245,179,1,.5)}
.tp .nm{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .nm small{color:var(--dim);font-weight:500;margin-left:4px}
.tp .rt{font-family:var(--cond);font-size:20px;font-weight:700;width:34px;text-align:right}
.tp .pin{color:var(--amber);font-size:12px}
.lines-dist{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lines-dist span{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.28);color:var(--muted)}
.lines-dist b{color:var(--text)}

/* Pitch */
.pitch-wrap{display:grid;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card3);color:var(--text)}
.pitch{position:relative;width:100%;aspect-ratio:68/105;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1e7a3c 0 7.142%,#1a6c35 7.142% 14.284%);
  box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 80px rgba(0,0,0,.35)}
.pitch::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.28));pointer-events:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;cursor:pointer;
  transition:left .75s cubic-bezier(.2,.9,.25,1.15),top .75s cubic-bezier(.2,.9,.25,1.15),opacity .4s,transform .5s}
.tok.pre{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.tok .disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:17px;color:#fff;
  border:2.5px solid rgba(255,255,255,.9);box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative}
.tok.A .disc{background:radial-gradient(circle at 35% 30%,#60a5fa,#1d4ed8)}
.tok.B .disc{background:radial-gradient(circle at 35% 30%,#f87171,#b91c1c)}
.tok.gk .disc{border-color:#fcd34d}
.tok.A.gk .disc{background:radial-gradient(circle at 35% 30%,#93c5fd,#1e40af)}
.tok.B.gk .disc{background:radial-gradient(circle at 35% 30%,#fca5a5,#991b1b)}
.tok .disc .rl{position:absolute;bottom:-6px;right:-8px;font-size:8.5px;font-family:var(--font);font-weight:800;background:#0b0d10;color:#fff;border-radius:5px;padding:1px 4px;border:1px solid rgba(255,255,255,.2)}
.tok .lbl{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.tok:hover .disc{transform:scale(1.08)}
.tok.swapsrc .disc{box-shadow:0 0 0 4px var(--amber),0 6px 14px rgba(0,0,0,.45)}
.tok .pinm{position:absolute;top:-6px;left:-6px;font-size:11px}
.pitch-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
.pitch-legend span{display:flex;align-items:center;gap:6px}
.pitch-legend i{width:10px;height:10px;border-radius:50%}

/* Compare */
.compare{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:18px}
.gauge{--p:0;--c:var(--green);width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;position:relative}
.gauge::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.gauge div{position:relative;text-align:center}
.gauge b{font-family:var(--cond);font-size:40px;font-weight:800;line-height:.9;display:block}
.gauge small{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.cmp-rows{display:grid;gap:10px}
.cmp{display:grid;grid-template-columns:48px 1fr 120px 1fr 48px;align-items:center;gap:8px;font-size:13px}
.cmp .va{font-family:var(--cond);font-size:19px;font-weight:700;text-align:right;color:#93c5fd}
.cmp .vb{font-family:var(--cond);font-size:19px;font-weight:700;color:#fca5a5}
.cmp .lb{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cmp .ta,.cmp .tb{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;display:flex}
.cmp .ta{justify-content:flex-end}
.cmp .ta i{background:linear-gradient(90deg,#1d4ed8,#60a5fa);border-radius:99px;transition:width .8s}
.cmp .tb i{background:linear-gradient(90deg,#f87171,#b91c1c);border-radius:99px;transition:width .8s}
.diff-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lock-banner,.swap-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px;font-weight:600}
.lock-banner{background:rgba(245,179,1,.1);border:1px solid rgba(245,179,1,.3);color:#fcd34d}
.swap-banner{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#bfdbfe;position:sticky;top:76px;z-index:30;backdrop-filter:blur(10px)}
.warn-banner{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13.5px;font-weight:600}

/* History */
.hist{display:grid;gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;animation:fadeUp .35s both}
.hhead{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:14px 16px;cursor:pointer}
.hdate{text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:58px}
.hdate b{display:block;font-family:var(--cond);font-size:26px;font-weight:800;line-height:1}
.hdate span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.hvs{display:flex;align-items:center;gap:12px;font-family:var(--cond);font-size:20px;font-weight:700}
.hvs .a{color:#93c5fd}.hvs .b{color:#fca5a5}
.hscore{white-space:nowrap;font-family:var(--cond);font-size:28px;font-weight:800;letter-spacing:1px;background:var(--bg2);padding:4px 12px;border-radius:10px;border:1px solid var(--line)}
.hbody{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1fr 300px 1fr;gap:16px;align-items:start}
.hbody .pitch{max-width:300px}
.hteam h4{font-family:var(--cond);font-size:18px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hteam ul{list-style:none;display:grid;gap:4px}
.hteam li{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 8px;background:var(--bg2);border-radius:8px}
.hteam li .rt{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:16px}
.hactions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px}

/* Settings */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.slider-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;margin-bottom:12px}
.slider-row label{font-weight:600;font-size:14px}
.slider-row b{font-family:var(--cond);font-size:22px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--bg2);outline:none;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--green);border:3px solid #0a0b0d;box-shadow:0 0 0 1px var(--green);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid #0a0b0d;cursor:pointer}
.weight-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg2);border-radius:10px;font-size:13px;margin-top:6px}
.wbar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-family:var(--cond);font-size:18px;color:var(--muted)}
.fchip.on{border-color:var(--green);color:var(--green);background:rgba(61,220,132,.08)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h h3{font-family:var(--cond);font-size:24px;font-weight:800;text-transform:uppercase}
.modal-b{padding:20px;display:grid;gap:16px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.rng{display:grid;grid-template-columns:120px 1fr 34px;gap:12px;align-items:center}
.rng label{font-size:13.5px;font-weight:600}
.rng output{font-family:var(--cond);font-size:22px;font-weight:700;text-align:right}
.rng.off{opacity:.4}
.rng .use{display:flex;align-items:center;gap:6px}
.pos-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos-toggle button{padding:10px 6px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:13px;color:var(--muted)}
.pos-toggle button.on.GK{border-color:var(--amber);color:#fcd34d;background:rgba(245,179,1,.1)}
.pos-toggle button.on.DEF{border-color:var(--blue);color:#93c5fd;background:rgba(59,130,246,.1)}
.pos-toggle button.on.MID{border-color:var(--green);color:#86efac;background:rgba(61,220,132,.1)}
.pos-toggle button.on.FWD{border-color:var(--red);color:#fca5a5;background:rgba(239,68,68,.1)}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.sheet-actions{display:grid;gap:8px}
.sheet-actions .btn{justify-content:flex-start;padding:13px 14px}
.role-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.role-pick button{padding:10px 4px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-size:12.5px;font-weight:700}
.role-pick button.on{border-color:var(--green);color:var(--green)}
.role-pick button small{display:block;font-family:var(--cond);font-size:18px;color:var(--text)}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));z-index:200;display:grid;gap:8px;width:max-content;max-width:92vw}
.toast{background:#1d222b;border:1px solid var(--line2);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{border-color:rgba(61,220,132,.4)}.toast.err{border-color:rgba(239,68,68,.5)}

/* Generating overlay */
.gen{position:fixed;inset:0;z-index:150;background:rgba(6,7,9,.86);backdrop-filter:blur(10px);display:grid;place-items:center;animation:fade .2s}
.gen-in{text-align:center;width:min(420px,88vw)}
.gen .ball{width:84px;height:84px;margin:0 auto 22px;animation:spin 1s linear infinite;filter:drop-shadow(0 10px 30px rgba(61,220,132,.35))}
.gen h3{font-family:var(--cond);font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.gen p{color:var(--muted);margin-top:6px;font-size:14px}
.gen .prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:20px 0 10px}
.gen .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:99px;transition:width .15s}
.gen .cnt{font-family:var(--cond);font-size:20px;font-weight:700}
.gen .crit{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.gen .crit span{font-size:11.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);opacity:.35;transition:.3s}
.gen .crit span.on{opacity:1;color:var(--green);border-color:rgba(61,220,132,.5)}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media (max-width:1180px){
  .teams-layout{grid-template-columns:1fr 1fr}
  .teams-layout .pitch-col{grid-column:1/-1;order:-1;max-width:520px;width:100%;margin:0 auto}
}
@media (max-width:900px){
  nav.tabs{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(14,16,19,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--dim);text-decoration:none;font-size:10.5px;font-weight:600;border-radius:10px}
  nav.bottom a.on{color:var(--green)}
  #toasts{bottom:calc(84px + var(--safe-b))}
  .match-layout{grid-template-columns:1fr}
  .match-side{position:static}
  .set-grid{grid-template-columns:1fr}
  .stats-strip{grid-template-columns:repeat(2,1fr)}
  .hbody{grid-template-columns:1fr}
  .hbody .pitch{margin:0 auto}
  .swap-banner{top:64px}
}
@media (max-width:640px){
  main{padding:16px 14px 120px}
  .top-in{padding:10px 14px}
  .brand{font-size:19px}
  .view-head h1{font-size:28px}
  .teams-layout{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr;justify-items:center}
  .cmp{grid-template-columns:40px 1fr 92px 1fr 40px;gap:6px}
  .cmp .lb{font-size:10px}
  .tok .disc{width:34px;height:34px;font-size:14px;border-width:2px}
  .tok .lbl{font-size:9.5px;padding:1px 5px;max-width:74px}
  .hhead{grid-template-columns:auto 1fr auto;gap:10px}
  .hhead .hbal{display:none}
  .hscore{font-size:22px;padding:4px 8px}
  .hvs{font-size:17px;gap:8px;flex-wrap:wrap}
  .pitch-legend .mid{display:none}
  .slider-row{grid-template-columns:110px 1fr 46px}
  .rng{grid-template-columns:96px 1fr 30px}
  .modal-back{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:var(--safe-b)}
  .sync span{display:none}
  .team-top .row .btn span.t{display:none}
}

.tb-btn.on{background:rgba(61,220,132,.14);color:var(--green);box-shadow:inset 0 0 0 1px rgba(61,220,132,.4)}

@media (max-width:900px){ .tb-layout{grid-template-columns:1fr} nav.bottom{grid-template-columns:repeat(6,1fr)} nav.bottom a{font-size:9.5px} }

/* ================== Reyting motoru (FM tarzı) ==================
   • Her mevki için reyting = o mevkide önemli özelliklerin ağırlıklı ortalaması (kritik ×5, önemli ×3, yardımcı ×1).
   • Mevki yatkınlığı çarpanı: Doğal %100, Yetkin %96, Alışkın %90, Az deneyimli %80.
   • Genel reyting = oynayabildiği mevkiler içindeki EN YÜKSEK mevki reytingi. Ortalama alınmaz. */
const LEGACY_POS = {DEF:['STP','BEK'],MID:['OS'],FWD:['FV'],GK:['GK']};
const nv=(v,d)=>{ if(v===null||v===undefined||v===''||isNaN(+v)) v=d; return clamp(Math.round(+v),1,99); };
// Eski (v1) özellik setinden FM setine dönüşüm — yalnızca bir kez, kayıt v2 değilse
function fromLegacy(p){
  const g=k=>nv(p[k],50);
  const gk=g('gk'),def=g('def'),fb=nv(p.fullback,def),mid=g('mid'),win=nv(p.winger,(mid+g('fwd'))/2),fwd=g('fwd');
  const spd=nv(p.speed,60),agi=nv(p.agility,spd),sta=g('stamina'),str=nv(p.strength,(def+sta)/2),agr=nv(p.aggression,def*.6+sta*.4);
  const pas=g('passing'),bc=nv(p.ballControl,pas),drb=nv(p.technique,60),vis=nv(p.vision,(pas+mid)/2),sp=nv(p.setPiece,pas);
  const fin=nv(p.finishing,nv(p.shooting,fwd)),sp2=nv(p.shotPower,fin),com=nv(p.composure,(drb+pas)/2),hea=nv(p.heading,(def+fwd)/2),tac=nv(p.tackling,(def+fb)/2),ref=nv(p.reflexes,gk);
  const a=(...x)=>Math.round(x.reduce((s,v)=>s+v,0)/x.length);
  return {finishing:fin,dribbling:drb,firstTouch:bc,heading:hea,corners:sp,marking:a(tac,def),crossing:a(pas,win),passing:pas,penalty:a(fin,com),freeKick:sp,
    technique:a(drb,bc),tackling:tac,longShots:sp2,aggression:agr,bravery:a(agr,str),workRate:sta,decisions:a(vis,com),determination:a(sta,agr),
    concentration:com,leadership:a(com,vis),anticipation:a(vis,def,tac),flair:drb,positioning:a(def,tac),composure:com,teamwork:a(pas,sta),offTheBall:a(fwd,win),vision:vis,
    agility:agi,stamina:sta,balance:a(str,agi),strength:str,pace:spd,acceleration:a(spd,agi),naturalFitness:sta,jumping:hea,
    reflexes:ref,handling:gk,oneOnOne:gk,aerialReach:gk,rushingOut:gk,kicking:a(gk,pas),throwing:gk,communication:gk};
}
function normPlayer(p){
  p=Object.assign({},p);
  if(p.v!==2){
    const conv=fromLegacy(p);
    const legacyPos=[]; (p.positions||[]).forEach(c=>{ if(POSM[c]) legacyPos.push(c); else (LEGACY_POS[c]||[]).forEach(x=>legacyPos.push(x)); });
    ATTR_KEYS.forEach(k=>p[k]=conv[k]);
    p.fam=p.fam||Object.fromEntries([...new Set(legacyPos)].map(c=>[c,'D']));
    p.v=2;
  }
  ATTR_KEYS.forEach(k=>p[k]=nv(p[k],50));
  p.fam=Object.fromEntries(Object.entries(p.fam||{}).filter(([c,l])=>POSM[c]&&FAM[l]));
  p.positions=POS.map(x=>x.c).filter(c=>FAM_PLAYABLE.includes(p.fam[c]));
  p.foot=FOOTS.includes(p.foot)?p.foot:'Sağ';
  p.weakFoot=nv(p.weakFoot,p.foot==='İki ayak'?85:45);
  ['age','height','weight'].forEach(k=>{ p[k]=(p[k]===null||p[k]===undefined||p[k]===''||isNaN(+p[k]))?null:Math.round(+p[k]); });
  p.cond=Math.round(0.6*p.stamina+0.4*p.naturalFitness);   // takım dengesi için kondisyon
  return p;
}
let AIC = new WeakMap();
function resetAI(){ AIC = new WeakMap(); PERFC=null; }
function posRating(p,c){
  let s=0,w=0; for(const [k,wt] of Object.entries(POS_W[c])){ s+=wt*(+p[k]||1); w+=wt; }
  return s/w;
}
const famFactor=(p,c)=>{ const l=(p.fam||{})[c]; return l?FAM[l][1]:null; };
function aiRate(p){
  const raw=POS.map(x=>({c:x.c,raw:posRating(p,x.c)}));
  raw.forEach(x=>{ const f=famFactor(p,x.c); x.v=x.raw*(f??FAM.Z[1]); x.fam=(p.fam||{})[x.c]||null; });
  const r=raw.slice().sort((a,b)=>b.v-a.v);
  const play=r.filter(x=>FAM_PLAYABLE.includes(x.fam));
  const best=play[0]||r.slice().sort((a,b)=>b.raw-a.raw)[0];
  return {overall:clamp(Math.round(best.v),1,99),best:best.c,ratings:Object.fromEntries(raw.map(x=>[x.c,Math.round(x.v)])),raw:Object.fromEntries(raw.map(x=>[x.c,Math.round(x.raw)])),order:r.map(x=>x.c)};
}
// Bir mevkide en etkili özellikler
const keyAttrs = (c,n=6)=>Object.entries(POS_W[c]).filter(([k])=>ATTRM[k]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k);
// Reytingi en çok yukarı / aşağı çeken özellikler (açıklama için)
function explain(p,c){
  const W=POS_W[c]; const tot=Object.values(W).reduce((a,b)=>a+b,0); const base=posRating(p,c);
  return Object.entries(W).map(([k,w])=>({k,w,v:+p[k],eff:w*((+p[k])-base)/tot})).sort((a,b)=>b.eff-a.eff);
}
function ai(p){
  let c=AIC.get(p); if(c) return c;
  const base=aiRate(p); const pen=1-S.settings.offPenalty/100;
  const line={};
  ROLES.forEach(L=>{ let best=null; LINE_SUBS[L].forEach(([sub,f])=>{ const ff=famFactor(p,sub); let v=posRating(p,sub)*f*(ff??pen); if(!best||v>best.v) best={v,sub}; }); line[L]=best; });
  const adj=p.id?perfAdj(p.id):0;
  if(adj){ base.overall=clamp(Math.round(base.overall+adj),1,99); Object.keys(base.ratings).forEach(k=>base.ratings[k]=clamp(Math.round(base.ratings[k]+adj),1,99)); ROLES.forEach(L=>line[L].v+=adj); }
  c=Object.assign(base,{line,adj}); AIC.set(p,c); return c;
}
const overallOf = p=>ai(p).overall;
function roleScore(p,role){ return ai(p).line[role].v; }
function subOf(p,role){ return ai(p).line[role].sub; }
const inLine = (p,role)=>LINE_SUBS[role].some(([s])=>FAM_PLAYABLE.includes((p.fam||{})[s]));
const footShort = f=>f==='Sol'?'Sol':f==='İki ayak'?'İki':'Sağ';

/* ================== Supabase (REST) adaptörü ================== */
const Cloud = {
  cfg(){return {url:APP_CONFIG.SUPABASE_URL.replace(/\/+$/,''), key:APP_CONFIG.SUPABASE_ANON_KEY};},
  get on(){const c=this.cfg();return !!(c.url&&c.key&&G.code);},
  async req(path,{method='GET',body,prefer,code}={}){
    const {url,key}=this.cfg();
    let lastErr;
    for(let attempt=0;attempt<3;attempt++){
      let r;
      try{
        const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),15000);
        r=await fetch(`${url}/rest/v1/${path}`,{method,body,signal:ctl.signal,cache:'no-store',headers:{apikey:key,Authorization:`Bearer ${key}`,'Content-Type':'application/json','x-group-code':code||G.code||'','x-edit-pass':(code&&code!==G.code)?'':EDIT.pw,Prefer:prefer||'return=minimal'}});
        clearTimeout(tm);
      }catch(e){ lastErr=Object.assign(new Error('Ağ bağlantısı kurulamadı'),{network:true}); await new Promise(z=>setTimeout(z,800*(attempt+1))); continue; }
      if(r.ok){ const t=await r.text(); return t?JSON.parse(t):null; }
      const txt=await r.text().catch(()=> '');
      lastErr=Object.assign(new Error(`${r.status} ${txt}`.slice(0,300)),{status:r.status,network:r.status>=500||r.status===429});
      if(!lastErr.network) break;
      await new Promise(z=>setTimeout(z,800*(attempt+1)));
    }
    throw lastErr;
  },
  select(t){return this.req(`${t}?select=*`);},
  async upsert(t,rows,conflict='id'){
    try{ return await this.req(`${t}?on_conflict=${conflict}`,{method:'POST',body:JSON.stringify(rows),prefer:'resolution=merge-duplicates,return=minimal'}); }
    catch(e){
      if(t==='players'&&!NO_ATTRS_COL&&/attrs/.test(e.message)){ NO_ATTRS_COL=true; toast('Yeni özellikler şimdilik bu cihazda saklanıyor (veritabanı güncellemesi bekleniyor)');
        return this.req(`${t}?on_conflict=${conflict}`,{method:'POST',body:JSON.stringify(rows.map(r=>{const c={...r};delete c.attrs;return c;})),prefer:'resolution=merge-duplicates,return=minimal'}); }
      throw e;
    }
  },
  del(t,col,val){return this.req(`${t}?${col}=eq.${encodeURIComponent(val)}`,{method:'DELETE'});}
};
let NO_ATTRS_COL=false; // veritabanında attrs sütunu yoksa yeni özellikler yalnızca yerelde tutulur
const PERSIST_KEYS=[...ATTR_KEYS,'fam','v','foot','weakFoot','age','height','weight'];
const pToRow = p=>{const a=ai(p),R=a.raw;const r={id:p.id,group_id:G.id,name:p.name,overall:a.overall,stamina:p.cond,gk:R.GK,def:R.STP,fullback:R.BEK,mid:R.OS,winger:R.KNT,fwd:R.FV,positions:p.positions,
  speed:p.pace,passing:p.passing,shooting:p.finishing,technique:p.technique,active:p.active!==false,created_at:p.createdAt||new Date().toISOString(),updated_at:new Date().toISOString()};
  if(!NO_ATTRS_COL) r.attrs=Object.fromEntries(PERSIST_KEYS.map(k=>[k,p[k]])); return r;};
const pFromRow = r=>{const a=r.attrs||{}; const base=a.v===2?{}:{stamina:r.stamina,gk:r.gk,def:r.def,fullback:r.fullback,mid:r.mid,winger:r.winger,fwd:r.fwd,positions:r.positions||[],speed:r.speed,passing:r.passing,shooting:r.shooting,technique:r.technique};
  return normPlayer(Object.assign(base,a,{id:r.id,name:r.name,active:r.active!==false,createdAt:r.created_at}));};
const mToRow = m=>({id:m.id,group_id:G.id,match_date:m.date,player_ids:m.playerIds,team_a:m.teamA,team_b:m.teamB,metrics:m.metrics,score_a:m.scoreA??null,score_b:m.scoreB??null,note:m.note||null,stats:m.stats||{},created_at:m.createdAt});
const mFromRow = r=>({id:r.id,date:r.match_date,playerIds:r.player_ids||[],teamA:r.team_a,teamB:r.team_b,metrics:r.metrics,scoreA:r.score_a,scoreB:r.score_b,note:r.note,stats:r.stats||{},createdAt:r.created_at});
const attRow = (d,ids)=>({group_id:G.id,match_date:d,player_ids:ids});

function setSync(state,msg){
  UI.syncState=state; const el=$('#sync'); if(!el) return;
  el.className='sync '+(state==='ok'?'ok':state==='err'?'err':'');
  const q=Q.ops.length;
  el.querySelector('span').textContent = msg || (state==='ok'?'Senkron':state==='err'?'Senkron hatası':state==='wait'?`Bağlantı bekleniyor${q?` (${q})`:''}`:state==='busy'?'Senkronize ediliyor…':'Yerel kayıt');
  el.title = UI.lastErr ? 'Son hata: '+UI.lastErr : '';
}
/* Yazma kuyruğu: işlemler sırayla gönderilir; bağlantı koparsa kaybolmaz, otomatik tekrar denenir */
const Q={ops:[],running:false,timer:null,delay:3000};
function cloud(fn){
  if(!Cloud.on) return;
  const code=G.code;
  Q.ops.push(()=>code===G.code?fn():Promise.resolve()); markUnsynced(true); flushQueue();
}
function markUnsynced(v){ try{ const k='hsp2_unsynced_'+G.code; v?localStorage.setItem(k,'1'):localStorage.removeItem(k); }catch(e){} }
async function flushQueue(){
  if(Q.running||!Q.ops.length) return;
  Q.running=true; clearTimeout(Q.timer); setSync('busy');
  while(Q.ops.length){
    try{ await Q.ops[0](); Q.ops.shift(); Q.delay=3000; UI.lastErr=null; }
    catch(e){
      console.warn('Supabase',e); UI.lastErr=e.message;
      if(e.network){ Q.running=false; setSync('wait'); Q.timer=setTimeout(flushQueue,Q.delay); Q.delay=Math.min(Q.delay*2,30000); return; }
      Q.ops.shift();
      if(/42501|row-level security|401|403/.test(e.message)){ EDIT.ok=false; G.hasPw=true; toast('Bu değişiklik için düzenleme şifresi gerekli — kaydedilmedi','err'); setSync('ok'); Q.ops=[]; Q.running=false; markUnsynced(false); cloudPull(true); return; }
      setSync('err'); toast('Kaydedilemedi: '+e.message.slice(0,80),'err');
    }
  }
  Q.running=false; markUnsynced(false); if(UI.syncState!=='err') setSync('ok');
}
window.addEventListener('online',()=>{ Q.delay=3000; flushQueue(); });
async function cloudPull(silent){
  if(!Cloud.on) return false;
  if(Q.ops.length||Q.running){ flushQueue(); return false; }
  const code=G.code;
  setSync('busy');
  refreshGroupInfo();
  try{
    const opt=t=>Cloud.select(t).catch(e=>{ if(e.network) throw e; return null; });
    const [pl,ma,se,at,vo,rs,cl,fx]=await Promise.all([Cloud.select('players'),Cloud.select('matches'),Cloud.select('app_settings'),Cloud.select('attendance'),opt('votes'),opt('rsvp'),opt('club'),opt('fixtures')]);
    if(code!==G.code) return false;
    if((pl&&pl.length)||!S.players.length){
      S.players=(pl||[]).map(pFromRow);
      S.matches=(ma||[]).map(mFromRow);
      const st=(se||[])[0]; if(st&&st.data){ S.settings=Object.assign(clone(DEFAULT_SETTINGS),st.data); S.settings.weights=Object.assign(clone(DEFAULT_SETTINGS.weights),S.settings.weights||{}); }
      S.attendance={}; (at||[]).forEach(a=>S.attendance[a.match_date]=a.player_ids||[]);
      if(vo) S.votes=vo.map(v=>({matchId:v.match_id,voterId:v.voter_id,mvpId:v.mvp_id,ratings:v.ratings||{},createdAt:v.created_at,updatedAt:v.updated_at}));
      if(rs){ S.rsvp={}; rs.forEach(r=>{ (S.rsvp[r.match_date]=S.rsvp[r.match_date]||{})[r.player_id]={s:r.status,at:r.created_at}; }); }
      if(cl&&cl[0]) S.club={name:cl[0].name||'',squad:cl[0].squad||[],data:cl[0].data||{}};
      if(fx) S.fixtures=fx.map(fxFromRow);
      resetAI(); applyRsvpToDraft();
      S.draft.selected=S.draft.selected.filter(id=>getP(id));
      if(S.current&&!S.current.playerIds.every(id=>getP(id))&&!S.current.matchId) S.current=null;
      if(S.current) computeMetrics(S.current);
      persist(); setSync('ok'); if(!silent) toast('Veriler güncellendi','ok');
      const busy=$('#modal-root').innerHTML||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
      if(!busy) render(); return true;
    }
    await cloudPushAll(true); return true;
  }catch(e){console.warn(e);UI.lastErr=e.message;setSync(e.network?'wait':'err');if(!silent) toast('Bağlantı kurulamadı: '+e.message.slice(0,90),'err');return false;}
}
async function cloudPushAll(quiet){
  if(!Cloud.on){return;}
  setSync('busy');
  try{
    if(S.players.length) await Cloud.upsert('players',S.players.map(pToRow));
    if(S.matches.length) await Cloud.upsert('matches',S.matches.map(mToRow));
    await Cloud.upsert('app_settings',[setRow()]);
    const at=Object.entries(S.attendance).map(([d,ids])=>attRow(d,ids));
    if(at.length) await Cloud.upsert('attendance',at,'group_id,match_date');
    setSync('ok'); if(!quiet) toast('Tüm veriler buluta yüklendi','ok');
    markUnsynced(false);
  }catch(e){console.warn(e);UI.lastErr=e.message;setSync(e.network?'wait':'err');if(!quiet) toast('Yükleme başarısız: '+e.message.slice(0,90),'err');}
}

/* ================== Gruplar ================== */
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>{const a=new Uint32Array(8);crypto.getRandomValues(a);return Array.from(a,x=>CODE_ABC[x%CODE_ABC.length]).join('');};
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const inviteLink=code=>`${location.origin}${location.pathname}?g=${code}`;
async function joinGroup(code,{silent}={}){
  code=normCode(code); if(code.length<4){toast('Geçersiz grup kodu','err');return false;}
  let g=null;
  try{ const r=await Cloud.req('groups?select=id,name,code,has_password',{code}); g=(r||[])[0]; }
  catch(e){ toast(e.network?'İnternet bağlantısı yok, tekrar deneyin':'Grup bulunamadı','err'); return false; }
  if(!g){ toast('Bu koda ait grup bulunamadı','err'); return false; }
  const ex=G.list.find(x=>x.code===g.code); if(ex) ex.hasPw=!!g.has_password; else G.list.push({id:g.id,name:g.name,code:g.code,hasPw:!!g.has_password});
  await switchGroup(g.code);
  if(!silent) toast(`"${g.name}" grubuna katıldınız`,'ok');
  return true;
}
async function createGroup(name,withDemo,pw){
  name=String(name||'').trim(); if(name.length<2){toast('Grup adı girin','err');return false;}
  if(!pw||pw.length<4){toast('En az 4 karakterlik bir düzenleme şifresi belirleyin','err');return false;}
  const code=newCode();
  let g;
  try{
    await Cloud.req('groups',{method:'POST',code,body:JSON.stringify([{name,code}])});
    const r=await Cloud.req('groups?select=id,name,code',{code}); g=(r||[])[0];
    if(!g) throw new Error('grup okunamadı');
    await Cloud.req('rpc/set_edit_password',{method:'POST',code,body:JSON.stringify({new_pw:pw}),prefer:'return=representation'});
  }
  catch(e){ toast('Grup oluşturulamadı: '+e.message.slice(0,80),'err'); return false; }
  G.list.push({id:g.id,name:g.name,code:g.code,hasPw:true});
  try{ localStorage.setItem('hsp2_editpw_'+g.code,pw); }catch(e){}
  await switchGroup(g.code,{fresh:true});
  if(withDemo){ seedDemo(); persist(); await cloudPushAll(true); render(); }
  else { await Cloud.upsert('app_settings',[setRow()]).catch(()=>{}); }
  return true;
}
async function switchGroup(code,{fresh}={}){
  const g=G.list.find(x=>x.code===code); if(!g) return;
  persist();
  Object.assign(G,{code:g.code,id:g.id,name:g.name,hasPw:!!g.hasPw}); persistGroups(); loadEdit();
  Q.ops=[]; resetAI(); loadLocal(); UI.swapFrom=null; UI.openHist=null;
  render();
  if(!fresh) await cloudPull(true);
}
function leaveGroup(code){
  G.list=G.list.filter(x=>x.code!==code);
  try{localStorage.removeItem('hsp2_data_'+code);}catch(e){}
  if(G.code===code){ const n=G.list[0]; if(n){ switchGroup(n.code); } else { Object.assign(G,{code:null,id:null,name:''}); persistGroups(); render(); } }
  else { persistGroups(); render(); }
}

/* ================== Dengeleme Motoru ==================
   1) Her 7'li alt küme için oyuncu→hat ataması dinamik programlama ile optimize edilir
      (izinli dizilişlerin hepsi denenir, en yüksek mevki uyumu seçilir).
   2) 14 oyuncunun tüm benzersiz bölünmeleri (C(14,7)/2 = 1716) değerlendirilir.
   3) Ağırlıklı maliyet (güç, mevki dengesi, kondisyon, kaleci) minimize edilir.
   ====================================================== */
function parseF(name){const [d,m,f]=name.split('-').map(Number);return {d,m,f,name};}
function formationsFor(n){
  const of=n-1, st=S.settings;
  if(n===7){
    let list = st.autoFormation ? st.formations.slice() : [st.defaultFormation];
    if(!list.includes(st.defaultFormation)) list.unshift(st.defaultFormation);
    return list.map(parseF);
  }
  const out=[]; const min=of>=3?1:0, cap=Math.min(of,5);
  for(let d=min;d<=cap;d++)for(let m=min;m<=Math.min(of-d,5);m++){const f=of-d-m;if(f>=min&&f<=3)out.push({d,m,f,name:`${d}-${m}-${f}`});}
  return out.length?out:[{d:Math.max(of,0),m:0,f:0,name:`${Math.max(of,0)}-0-0`}];
}
function assign(sc,fm){
  const caps=[sc.length>0?1:0,fm.d,fm.m,fm.f];
  if(caps[0]+caps[1]+caps[2]+caps[3]!==sc.length) return null;
  let st=new Map([[0,{v:0,path:[]}]]);
  for(let i=0;i<sc.length;i++){
    const nx=new Map();
    for(const [k,s] of st){
      const c=[k>>9&7,k>>6&7,k>>3&7,k&7];
      for(let r=0;r<4;r++){
        if(c[r]>=caps[r]) continue;
        c[r]++; const nk=(c[0]<<9)|(c[1]<<6)|(c[2]<<3)|c[3]; c[r]--;
        const v=s.v+sc[i][r]; const ex=nx.get(nk);
        if(!ex||v>ex.v) nx.set(nk,{v,path:s.path.concat(r)});
      }
    }
    st=nx;
  }
  const fk=(caps[0]<<9)|(caps[1]<<6)|(caps[2]<<3)|caps[3];
  const fin=st.get(fk); return fin?{v:fin.v,roles:fin.path.map(r=>ROLES[r])}:null;
}
function optimizeRoles(ps){
  const sc=ps.map(p=>ROLES.map(r=>roleScore(p,r)));
  let best=null; const def=ps.length===7?S.settings.defaultFormation:(DEF_FORM[ps.length]||''); const half=Math.ceil((ps.length-1)/2);
  for(const fm of formationsFor(ps.length)){
    const r=assign(sc,fm); if(!r) continue;
    const v=r.v+(fm.name===def?10:0)-6*Math.max(0,fm.d-half)-4*Math.max(0,fm.m-half); // varsayılan dizilişe hafif öncelik
    if(!best||v>best.v) best={v,roles:r.roles,formation:fm.name};
  }
  return best||{roles:ps.map((_,i)=>i===0?'GK':'MID'),formation:'—'};
}
function teamStats(ps,roles){
  const n=ps.length; const vals=ps.map((p,i)=>roleScore(p,roles[i]));
  const pw=ps.map((p,i)=>0.4*overallOf(p)+0.6*vals[i]);
  const total=pw.reduce((a,b)=>a+b,0);
  const lines={};
  ['DEF','MID','FWD'].forEach(l=>{const v=vals.filter((_,i)=>roles[i]===l);lines[l]={count:v.length,avg:avg(v),sum:v.reduce((a,b)=>a+b,0)};});
  const gi=roles.indexOf('GK');
  const out=vals.filter((_,i)=>roles[i]!=='GK');
  return {n,total,power:n?total/n:0,stamina:avg(ps.map(p=>+p.cond||0)),gk:gi>=0?vals[gi]:0,gkCount:roles.filter(r=>r==='GK').length,
    lines,outAvg:avg(out),posFit:vals.reduce((a,b)=>a+b,0),formation:`${lines.DEF.count}-${lines.MID.count}-${lines.FWD.count}`};
}
function weightsNorm(){const w=S.settings.weights;const t=(w.power+w.pos+w.stamina+w.gk)||1;return {power:w.power/t,pos:w.pos/t,stamina:w.stamina/t,gk:w.gk/t};}
function compareTeams(A,B){
  const w=weightsNorm();
  const lineDiff=avg(['DEF','MID','FWD'].map(l=>Math.abs(A.lines[l].avg-B.lines[l].avg)));
  const comps={
    power:Math.abs(A.total-B.total)/Math.max(A.n,B.n,1)/SC,
    pos:(Math.abs(A.outAvg-B.outAvg)+0.5*lineDiff)/SC,
    stamina:Math.abs(A.stamina-B.stamina)/SC,
    gk:Math.abs(A.gk-B.gk)/4/SC
  };
  const cost=w.power*comps.power+w.pos*comps.pos+w.stamina*comps.stamina+w.gk*comps.gk;
  return {cost,comps,balance:clamp(100-cost*38,0,100),powerDiff:Math.abs(A.total-B.total)};
}
function combos(n,k){const out=[],c=[];(function rec(s){if(c.length===k){out.push(c.slice());return;}for(let i=s;i<=n-(k-c.length);i++){c.push(i);rec(i+1);c.pop();}})(0);return out;}
const COMBO_LIMIT=7000;
function binom(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}
// Büyük kadrolarda (8'e 8 ve üstü) tüm bölünmeler yerine rastgele örneklem + yerel iyileştirme
function sampleSplits(n,k,ia,ib,count){
  const free=[...Array(n).keys()].filter(i=>!ia.includes(i)&&!ib.includes(i)); const need=k-ia.length; const seen=new Set(), out=[];
  for(let t=0;t<count*4&&out.length<count;t++){
    const f=free.slice(); for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]];}
    const a=[...ia,...f.slice(0,need)].sort((x,y)=>x-y); let key=a.join(',');
    if(!ia.length&&!ib.length&&a[0]!==0){ const s2=new Set(a); key=[...Array(n).keys()].filter(i=>!s2.has(i)).join(','); }
    if(seen.has(key)) continue; seen.add(key); out.push(key.split(',').map(Number));
  }
  return out;
}
function makeCtx(ps,pinA=new Set(),pinB=new Set()){
  const n=ps.length,k=Math.floor(n/2);
  const ia=[],ib=[]; ps.forEach((p,i)=>{if(pinA.has(p.id))ia.push(i);if(pinB.has(p.id))ib.push(i);});
  const hasPins=ia.length||ib.length;
  const free=n-ia.length-ib.length, total=binom(free-(hasPins?0:1),k-ia.length-(hasPins?0:1));
  if(total>COMBO_LIMIT) return {ps,n,k,ia,ib,list:sampleSplits(n,k,ia,ib,2500),cache:new Map(),results:[],big:true,space:binom(n,k)/(hasPins?1:2)};
  const list=combos(n,k).filter(c=>{
    if(!hasPins) return n%2===1||c[0]===0;
    for(const i of ia) if(!c.includes(i)) return false;
    for(const i of ib) if(c.includes(i)) return false;
    return true;
  });
  return {ps,n,k,ia,ib,list,cache:new Map(),results:[]};
}
function evalSplit(ctx,a){
  const set=new Set(a); const b=[]; for(let i=0;i<ctx.n;i++) if(!set.has(i)) b.push(i);
  const A=evalIdx(ctx,a),B=evalIdx(ctx,b); const cmp=compareTeams(A.st,B.st);
  return {A,B,cmp,score:cmp.cost-0.002*(A.st.posFit+B.st.posFit)/SC};
}
// Yerel iyileştirme: en iyi adaylardan başlayıp iki takım arasında oyuncu takası dener
async function improveSplits(ctx,onTick){
  const lock=new Set([...ctx.ia,...ctx.ib]); const seen=new Set(ctx.results.map(r=>r.A.idxs.join(',')));
  const starts=ctx.results.slice().sort((x,y)=>x.score-y.score).slice(0,8);
  for(let s=0;s<starts.length;s++){
    let cur=starts[s];
    for(let it=0;it<12;it++){
      let best=null;
      for(const i of cur.A.idxs){ if(lock.has(i)) continue;
        for(const j of cur.B.idxs){ if(lock.has(j)) continue;
          const a=cur.A.idxs.map(x=>x===i?j:x).sort((x,y)=>x-y); const key=a.join(',');
          const r=evalSplit(ctx,a); if(!seen.has(key)){ seen.add(key); ctx.results.push(r); }
          if(!best||r.score<best.score) best=r; } }
      if(!best||best.score>=cur.score-1e-9) break; cur=best;
    }
    if(onTick) onTick(s+1,starts.length); await new Promise(r=>setTimeout(r,0));
  }
}
function evalIdx(ctx,idxs){
  const key=idxs.join(','); let v=ctx.cache.get(key); if(v) return v;
  const ps=idxs.map(i=>ctx.ps[i]); const o=optimizeRoles(ps);
  v={idxs,roles:o.roles,formation:o.formation,st:teamStats(ps,o.roles)}; ctx.cache.set(key,v); return v;
}
function runChunk(ctx,from,to){
  for(let j=from;j<to&&j<ctx.list.length;j++) ctx.results.push(evalSplit(ctx,ctx.list[j]));
}
const splitKey=(res,ps)=>{const firstId=ps[0].id;const t=[res.A,res.B].find(t=>t.idxs.some(i=>ps[i].id===firstId));return t.idxs.map(i=>ps[i].id).sort().join('|');};
function pickResult(ctx,prevKey){
  const R=ctx.results.sort((x,y)=>x.score-y.score);
  if(!R.length) return null;
  if(!prevKey) return R[0];
  const best=R[0].cmp.cost;
  const cand=R.slice(0,60).filter(r=>r.cmp.cost<=best+0.15&&splitKey(r,ctx.ps)!==prevKey).slice(0,12);
  if(cand.length) return cand[Math.floor(Math.random()*cand.length)];
  return R.find(r=>splitKey(r,ctx.ps)!==prevKey)||R[0];
}
const SNAP_KEYS=['name',...PERSIST_KEYS,'guest','guestLevel'];
const snap = p=>Object.fromEntries(SNAP_KEYS.map(k=>[k,p[k]]));
function buildTeam(t,ps,pins){
  return {formation:t.formation,players:t.idxs.map((i,j)=>({id:ps[i].id,role:t.roles[j],pinned:pins.has(ps[i].id),snap:snap(ps[i])}))};
}
const SNAPC=new WeakMap();
const teamPlayer = e=>{ const live=getP(e.id); if(live) return live; let s=SNAPC.get(e); if(!s){ s=normPlayer(Object.assign({id:e.id,name:'Silinmiş oyuncu'},e.snap||{})); SNAPC.set(e,s);} return s; };
function statsOf(team){const ps=team.players.map(teamPlayer);return teamStats(ps,team.players.map(e=>e.role));}
function computeMetrics(cur){
  const A=statsOf(cur.teamA),B=statsOf(cur.teamB),cmp=compareTeams(A,B);
  cur.teamA.formation=A.formation; cur.teamB.formation=B.formation;
  const slim=s=>({n:s.n,total:s.total,power:s.power,stamina:s.stamina,gk:s.gk,formation:s.formation,posFit:s.posFit,outAvg:s.outAvg,lines:s.lines});
  cur.metrics={A:slim(A),B:slim(B),balance:cmp.balance,cost:cmp.cost,comps:cmp.comps,powerDiff:cmp.powerDiff,scale:99};
  return cur.metrics;
}
function reoptimizeTeam(team){
  const ps=team.players.map(teamPlayer); const o=optimizeRoles(ps);
  team.players.forEach((e,i)=>{e.role=o.roles[i];delete e.slot;}); team.formation=o.formation;
}

const ATTR_ALIAS={hiz:'pace',cabukluk:'agility',ceviklik:'agility',kondisyon:'stamina',dayaniklilik:'stamina',fizikselguc:'strength',guc:'strength',agresiflik:'aggression',
  pas:'passing',topkontrolu:'firstTouch',ilkkontrol:'firstTouch',dribling:'dribbling',dribbling:'dribbling',oyungorusu:'vision',vizyon:'vision',durantop:'freeKick',serbestvurus:'freeKick',
  bitiricilik:'finishing',sutgucu:'longShots',uzaktansutlar:'longShots',sogukkanlilik:'composure',sogukkanlik:'composure',havatopu:'heading',kafavurusu:'heading',topkapma:'tackling',refleks:'reflexes',
  kosevuruslari:'corners',markaj:'marking',ortayapma:'crossing',penaltikullanma:'penalty',penalti:'penalty',teknik:'technique',cesaret:'bravery',caliskanlik:'workRate',kararverme:'decisions',
  kararlilik:'determination',konsantrasyon:'concentration',liderlik:'leadership',onsezi:'anticipation',ozelyetenek:'flair',pozisyonalma:'positioning',takimoyunu:'teamwork',topsuzalan:'offTheBall',
  denge:'balance',hizlanma:'acceleration',vucutzindeligi:'naturalFitness',ziplama:'jumping',toptutma:'handling',birebir:'oneOnOne',havahakimiyeti:'aerialReach',kaledencikma:'rushingOut',
  ayaklaoyun:'kicking',elleoyun:'throwing',iletisim:'communication',kalecilikbecerisi:'handling'};
const POS_ALIAS={kaleci:'GK',kl:'GK',stoper:'STP',stp:'STP',bek:'BEK',ortasaha:'OS',os:'OS',kanat:'KNT',knt:'KNT',forvet:'FV',fv:'FV'};
const FAM_ALIAS={dogal:'D',d:'D',yetkin:'Y',y:'Y',aliskin:'A',a:'A',azdeneyimli:'Z',z:'Z'};
async function xlParse(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(r=>r.some(c=>c!==''));
  const head=aoa[0].map(h=>normTxt(h)); const out=[]; const unknown=[];
  const nameCol=head.findIndex((h,i)=>['adsoyad','ad','isim','oyuncu','adsoyadi'].includes(h)||(i===0&&!ATTR_ALIAS[h]&&!POS_ALIAS[h]));
  const colMap=head.map((h,i)=>{ if(i===nameCol) return null; if(ATTR_ALIAS[h]||ATTRM[h]) return {t:'a',k:ATTR_ALIAS[h]||h};
    if(POS_ALIAS[h]) return {t:'p',k:POS_ALIAS[h]}; if(h==='yas') return {t:'m',k:'age'}; if(h==='ayak') return {t:'m',k:'foot'}; if(h==='zayifayak') return {t:'m',k:'weakFoot'};
    if(h==='boy') return {t:'m',k:'height'}; if(h==='kilo') return {t:'m',k:'weight'}; if(h) unknown.push(aoa[0][i]); return null; });
  const nums=[]; aoa.slice(1).forEach(r=>colMap.forEach((m,i)=>{ if(m&&m.t==='a'&&r[i]!==''&&!isNaN(+r[i])) nums.push(+r[i]); }));
  const fm20=nums.length>0&&Math.max(...nums)<=20;
  aoa.slice(1).forEach(r=>{
    const name=String(r[nameCol]||'').trim(); if(!name) return;
    const row={name,attrs:{},fam:null,meta:{}};
    colMap.forEach((m,i)=>{ if(!m) return; const v=r[i]; if(v===''||v===null) return;
      if(m.t==='a'&&!isNaN(+v)) row.attrs[m.k]=clamp(Math.round(fm20?(+v)*4.95:+v),1,99);
      else if(m.t==='p'){ row.fam=row.fam||{}; const f=!isNaN(+v)?(+v>=(fm20?15:75)?'D':+v>=(fm20?11:55)?'A':null):FAM_ALIAS[normTxt(v)]; if(f) row.fam[m.k]=f; }
      else if(m.t==='m'){ if(m.k==='foot'){ const t=normTxt(v); row.meta.foot=t.startsWith('sol')||t==='l'?'Sol':t.startsWith('iki')||t==='b'?'İki ayak':'Sağ'; } else if(!isNaN(+v)) row.meta[m.k]=m.k==='weakFoot'&&fm20?Math.round(+v*4.95):+v; }
    });
    const nn=normTxt(name), first=normTxt(name.split(/\s+/)[0]);
    let match=S.players.find(p=>normTxt(p.name)===nn)||S.players.find(p=>normTxt(p.name.replace(/\s+/g,''))===nn);
    if(!match){ const c=S.players.filter(p=>normTxt(p.name.split(/\s+/)[0])===first||normTxt(p.name).startsWith(nn)); if(c.length===1) match=c[0]; }
    row.match=match||null; out.push(row);
  });
  return {rows:out,fm20,unknown};
}
function xlPreviewHTML(x){
  const upd=x.rows.filter(r=>r.match).length, add=x.rows.length-upd;
  return `<div class="status ok" style="margin-top:12px">${x.rows.length} satır: ${upd} oyuncu güncellenecek, ${add} yeni oyuncu eklenecek${x.fm20?' · FM 1–20 ölçeği algılandı, 99\'a çevrildi':''}.</div>
  ${x.unknown.length?`<p class="small muted" style="margin-top:8px">Tanınmayan sütunlar (yok sayılacak): ${x.unknown.map(esc).join(', ')}</p>`:''}
  <div class="xl-list">${x.rows.map(r=>`<div><b>${esc(r.name)}</b> <span class="small muted">→ ${r.match?esc(r.match.name):'yeni oyuncu'} · ${Object.keys(r.attrs).length} özellik</span></div>`).join('')}</div>`;

function xlApply(){

function matchStatus(){
  const n=S.draft.selected.length;
  const F=vsTxt(TEAM_SIZE);
  if(n===0) return {cls:'warn',t:`Maça gelecek oyuncuları seçin. ${F} için ${MATCH_SIZE} oyuncu gerekli.`};
  if(n<MATCH_SIZE) return {cls:'warn',t:`${MATCH_SIZE-n} oyuncu eksik. ${F} için ${MATCH_SIZE} oyuncu seçmelisiniz.`};
  if(n>MATCH_SIZE) return {cls:'err',t:`${n-MATCH_SIZE} oyuncu fazla. Lütfen ${MATCH_SIZE} oyuncu seçin (şu an ${n}).`};
  const sel=S.draft.selected.map(getP).filter(Boolean);
  const gks=sel.filter(p=>p.positions.includes('GK')).length;
  if(gks<2) return {cls:'ok',t:`${MATCH_SIZE} oyuncu hazır. Not: Seçilenler arasında ${gks===0?'hiç':'yalnızca 1'} kaleci var; kalecilik puanı en yüksek oyuncular kaleye geçirilecek.`};
  return {cls:'ok',t:`Kadro hazır! ${MATCH_SIZE} oyuncu ile ${F} takımlar oluşturulabilir.`};
}
function matchListHTML(){
  const q=UI.mSearch.trim().toLocaleLowerCase('tr');

/* ================== Takım oluşturma (animasyonlu) ================== */
async function generate(reroll=false){
  const cur=S.current;
  let ids, date, pinA=new Set(), pinB=new Set(), prevKey=null;
  if(reroll&&cur){
    if(cur.locked){toast('Takımlar kilitli. Önce kilidi açın.','err');return;}
    ids=cur.playerIds.slice(); date=cur.date;
    cur.teamA.players.filter(e=>e.pinned).forEach(e=>pinA.add(e.id));
    cur.teamB.players.filter(e=>e.pinned).forEach(e=>pinB.add(e.id));
  }else{
    ids=S.draft.selected.slice(); date=S.draft.date;
  }
  const ps=ids.map(getP).filter(Boolean);
  const need=reroll&&cur?ids.length:MATCH_SIZE;
  if(ps.length!==need||need%2){toast(`Takım oluşturmak için ${need} oyuncu gerekli (şu an ${ps.length}).`,'err');return;}
  if(pinA.size>need/2||pinB.size>need/2){toast(`Bir takımda en fazla ${need/2} sabit oyuncu olabilir`,'err');return;}
  if(reroll&&cur){
    const tmp={A:{idxs:ps.map((p,i)=>cur.teamA.players.some(e=>e.id===p.id)?i:-1).filter(i=>i>=0)},B:{idxs:ps.map((p,i)=>cur.teamB.players.some(e=>e.id===p.id)?i:-1).filter(i=>i>=0)}};
    try{prevKey=splitKey(tmp,ps);}catch(e){prevKey=null;}
  }
  const ctx=makeCtx(ps,pinA,pinB);
  const total=ctx.list.length;
  $('#modal-root').innerHTML=`<div class="gen"><div class="gen-in">
    <svg class="ball" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#f4f6f8" stroke="#0a0b0d" stroke-width="3"/><path d="M50 28l17 12-6 20H39l-6-20z" fill="#0a0b0d"/><path d="M50 4v24M67 40l22-8M61 60l14 20M39 60L25 80M33 40l-22-8" stroke="#0a0b0d" stroke-width="3"/></svg>
    <h3>${reroll?'Yeni Kombinasyon Aranıyor':'Takımlar Dengeleniyor'}</h3>
    <p>${vsTxt(ps.length/2)} · ${ctx.big?`${Math.round(ctx.space).toLocaleString('tr-TR')} olasılık içinden en iyi ${total.toLocaleString('tr-TR')} aday + ince ayar`:`${total.toLocaleString('tr-TR')} olası takım kombinasyonu analiz ediliyor`}</p>
    <div class="prog"><i id="gprog"></i></div>
    <div class="cnt" id="gcnt">0 / ${total.toLocaleString('tr-TR')}</div>
    <div class="crit" id="gcrit"><span>Genel güç</span><span>Mevki uyumu</span><span>Hat dengesi</span><span>Kondisyon</span><span>Kaleci</span></div>
  </div></div>`;
  const t0=performance.now(); const CH=120; const crit=[...document.querySelectorAll('#gcrit span')];
  for(let j=0;j<total;j+=CH){
    runChunk(ctx,j,j+CH);
    const done=Math.min(total,j+CH), pr=done/total;
    const gp=$('#gprog'), gc=$('#gcnt'); if(gp) gp.style.width=(pr*100)+'%'; if(gc) gc.textContent=`${done.toLocaleString('tr-TR')} / ${total.toLocaleString('tr-TR')}`;
    crit.forEach((c,i)=>c.classList.toggle('on',pr>=i/crit.length));
    await new Promise(r=>setTimeout(r,16));
  }
  if(ctx.big){ const gc=$('#gcnt'); await improveSplits(ctx,(a,b)=>{ if(gc) gc.textContent=`İnce ayar ${a}/${b}`; }); }
  const wait=Math.max(0,1100-(performance.now()-t0)); if(wait) await new Promise(r=>setTimeout(r,wait));
  const res=pickResult(ctx,prevKey);
  if(!res){$('#modal-root').innerHTML='';toast('Uygun kombinasyon bulunamadı (sabit oyuncuları kontrol edin)','err');return;}
  const pins=new Set([...pinA,...pinB]);
  S.current={id:uid(),matchId:reroll&&cur?cur.matchId:null,date,playerIds:ids,
    teamA:buildTeam(res.A,ps,pins),teamB:buildTeam(res.B,ps,pins),locked:false,saved:false,
    scoreA:reroll&&cur?cur.scoreA??null:null,scoreB:reroll&&cur?cur.scoreB??null:null,createdAt:new Date().toISOString()};
  computeMetrics(S.current);
  $('#modal-root').innerHTML='';
  UI.animate=true; UI.swapFrom=null; persist();
  if(UI.view!=='takimlar') go('takimlar'); else render();
  toast(`Denge skoru %${Math.round(S.current.metrics.balance)} · ${ctx.results.length.toLocaleString('tr-TR')} kombinasyon değerlendirildi`,'ok');
}

function orderLine(arr){ // bek/kanat oyuncularını kenarlara, stoper/orta sahayı merkeze yerleştir
  const wide=arr.filter(e=>WIDE.has(subOf(teamPlayer(e),e.role))), mid=arr.filter(e=>!wide.includes(e));
  if(!wide.length) return arr;
  const out=[...mid]; wide.forEach((e,i)=>{ if(i%2===0) out.unshift(e); else out.push(e); });
  return out;
}
function tokenPositions(team,side,mode){
  const groups={GK:[],DEF:[],MID:[],FWD:[]}; team.players.forEach(e=>groups[e.role].push(e));
  const Y=mode==='single'?{GK:90,DEF:71,MID:49,FWD:25}:side==='bottom'?{GK:92.5,DEF:80,MID:67.5,FWD:57.5}:{GK:7.5,DEF:20,MID:32.5,FWD:42.5};
  const out=[];
  ROLES.forEach(r=>{const g=groups[r]; const arr=g.some(e=>e.slot!=null)?g.slice().sort((a,b)=>(a.slot??99)-(b.slot??99)):orderLine(g); const n=arr.length; const sp=Math.min(mode==='single'?28:25,78/Math.max(n,1));
    arr.forEach((e,i)=>out.push({e,x:50+(i-(n-1)/2)*sp,y:Y[r]}));});
  return out;
}

  else add(mode==='A'?cur.teamA:cur.teamB,mode,'bottom');
  return `<div class="pitch">${pitchSVG()}${toks.map((t,i)=>{const p=teamPlayer(t.e);const v=roleScore(p,t.e.role);const sub=POSM[subOf(p,t.e.role)].s;

function manualFill(){

const LINE_Y=(mode,side)=>mode==='single'?{GK:90,DEF:71,MID:49,FWD:25}:side==='bottom'?{GK:92.5,DEF:80,MID:67.5,FWD:57.5}:{GK:7.5,DEF:20,MID:32.5,FWD:42.5};
function pitchTarget(pitch,x,y){
  const r=pitch.getBoundingClientRect(); const px=(x-r.left)/r.width*100, py=(y-r.top)/r.height*100;
  const both=UI.pitchView==='both'; const k=both?(py>52.5?'A':'B'):UI.pitchView;
  const Y=LINE_Y(both?'both':'single',k==='A'||!both?'bottom':'top');
  const role=ROLES.reduce((b,rl)=>Math.abs(Y[rl]-py)<Math.abs(Y[b]-py)?rl:b,'GK');
  return {k,role,px:clamp(px,4,96),ly:Y[role]};
}
function dropToPitch(id,k,role,px){
  const c=S.current, f=findInCurrent(id); if(!f) return;
  const T=k==='A'?c.teamA:c.teamB, oldRole=f.e.role, moved=f.k!==k;
  if(moved){ f.t.players.splice(f.i,1); f.e.pinned=false; T.players.push(f.e);
    if(oldRole==='GK'){ const cand=f.t.players.slice().sort((a,b)=>roleScore(teamPlayer(b),'GK')-roleScore(teamPlayer(a),'GK'))[0]; if(cand&&!f.t.players.some(e=>e.role==='GK')){cand.role='GK';delete cand.slot;} } }
  if(role==='GK'){ const gk=T.players.find(e=>e.role==='GK'&&e.id!==id); if(gk){ gk.role=moved?'DEF':oldRole; delete gk.slot; } }
  else if(!moved&&oldRole==='GK'){ const cand=T.players.filter(e=>e.id!==id).sort((a,b)=>roleScore(teamPlayer(b),'GK')-roleScore(teamPlayer(a),'GK'))[0]; if(cand){cand.role='GK';delete cand.slot;} }
  f.e.role=role;
  // hat içi sıralama: bırakılan x konumuna göre yerleştir
  const mode=UI.pitchView==='both'?'both':'single', side=k==='A'||mode==='single'?'bottom':'top';
  const xs=Object.fromEntries(tokenPositions(T,side,mode).map(t=>[t.e.id,t.x])); xs[id]=px;
  T.players.filter(e=>e.role===role).sort((a,b)=>xs[a.id]-xs[b.id]).forEach((e,i)=>e.slot=i);
  const nm=shortName(teamPlayer(f.e).name);
  afterChange(moved?`${nm} → ${k} Takımı · ${ROLE_TR[role]}`:oldRole===role?`${nm} yeri değişti`:`${nm} → ${ROLE_TR[role]}`);
}

/* ================== Sezon: skor, gol/asist, oylama, form, katılım ================== */
const meKey=()=>'hsp2_me_'+G.code;
const getMe=()=>{ try{ const v=localStorage.getItem(meKey()); return v&&getP(v)?v:null; }catch(e){ return null; } };
const setMe=id=>{ try{ id?localStorage.setItem(meKey(),id):localStorage.removeItem(meKey()); }catch(e){} };
const shareLink=(k,v)=>`${location.origin}${location.pathname}?g=${G.code}&${k}=${encodeURIComponent(v)}`;
async function shareText(title,text,url){
  if(navigator.share){ try{ await navigator.share({title,text,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  copyText(`${text}\n${url}`);
}
function nameOf(id){ const p=getP(id); if(p) return p.name;
  for(const f of S.fixtures){ const n=f.lineup&&f.lineup.names&&f.lineup.names[id]; if(n) return n; }
  for(const m of S.matches){ for(const t of [m.teamA,m.teamB]){ const e=t&&t.players.find(x=>x.id===id); if(e&&e.snap&&e.snap.name) return e.snap.name; } } return 'Silinmiş oyuncu'; }
const scored=m=>m&&m.teamA&&m.teamB&&m.scoreA!=null&&m.scoreB!=null;
const scoredMatches=()=>S.matches.filter(scored).sort((a,b)=>a.date.localeCompare(b.date)||String(a.createdAt).localeCompare(String(b.createdAt)));
const sideOf=(m,id)=>m.teamA.players.some(e=>e.id===id)?'A':m.teamB.players.some(e=>e.id===id)?'B':null;
const resOf=(m,k)=>{ const d=k==='A'?m.scoreA-m.scoreB:m.scoreB-m.scoreA; return d>0?'W':d<0?'L':'D'; };
const RES_TR={W:'G',D:'B',L:'M'};
const statOf=(m,f,id)=>+((m.stats&&m.stats[f]&&m.stats[f][id])||0);
/* Oy özeti: MVP (en çok oy, eşitlikte puan ortalaması) ve oyuncu başına ortalama puan */
function voteSummary(m){
  const vs=S.votes.filter(v=>v.matchId===m.id); const cnt={}, R={};
  vs.forEach(v=>{ if(v.mvpId) cnt[v.mvpId]=(cnt[v.mvpId]||0)+1;
    Object.entries(v.ratings||{}).forEach(([id,r])=>{ r=+r; if(!(r>=1&&r<=10)) return; const o=R[id]||(R[id]={sum:0,n:0}); o.sum+=r; o.n++; }); });
  Object.values(R).forEach(o=>o.avg=o.sum/o.n);
  let mvp=null; Object.entries(cnt).forEach(([id,c])=>{ if(!mvp||c>cnt[mvp]||(c===cnt[mvp]&&((R[id]||{}).avg||0)>((R[mvp]||{}).avg||0))) mvp=id; });
  return {n:vs.length,mvp,cnt,ratings:R,votes:vs};
}
/* Oylara göre performans etkisi: son 8 oylanan maçın puan ortalaması 6,5'in üstündeyse reyting artar, altındaysa düşer (±6) */
let PERFC=null;
function perfMap(){
  if(PERFC) return PERFC; PERFC={};
  if(S.settings.voteImpact===false) return PERFC;
  const per={}; scoredMatches().forEach(m=>{ const vs=voteSummary(m); Object.entries(vs.ratings).forEach(([id,o])=>{ if(!isGuest(id)) (per[id]=per[id]||[]).push(o.avg); }); });
  Object.entries(per).forEach(([id,arr])=>{ const a=arr.slice(-8); const av=avg(a); const adj=clamp((av-6.5)*1.6,-6,6)*Math.min(1,a.length/3);
    PERFC[id]={avg:av,n:a.length,adj:Math.round(adj*10)/10}; });
  return PERFC;
}

/* Form: son 5 maç (sonuç %60 + oy puanı %40) */
function formOf(id){
  const ms=scoredMatches().filter(m=>sideOf(m,id)).slice(-5);
  const list=ms.map(m=>{ const k=sideOf(m,id), r=resOf(m,k), vs=voteSummary(m), rt=vs.ratings[id]; return {m,r,rating:rt?rt.avg:null,goals:statOf(m,'goals',id),mvp:vs.mvp===id}; });
  if(list.length<2) return {list,trend:null,idx:null};
  const sc=x=>({W:1,D:.4,L:0}[x.r])*.6+(x.rating!=null?(x.rating-1)/9:.5)*.4+(x.mvp?.08:0)+Math.min(x.goals,3)*.02;
  const vals=list.map(sc), idx=avg(vals), recent=avg(vals.slice(-2)), older=avg(vals.slice(0,-2).length?vals.slice(0,-2):vals);
  const trend=idx>=.62||recent-older>.18?'up':idx<=.38||older-recent>.18?'down':'flat';
  return {list,trend,idx};
}

/* Sezon istatistikleri */
function seasonStats(year){
  const ms=scoredMatches().filter(m=>!year||m.date.startsWith(year));
  const st={}; const g=id=>st[id]||(st[id]={id,p:0,w:0,d:0,l:0,goals:0,assists:0,mvp:0,rs:0,rn:0,pts:0});
  const pairs={};
  ms.forEach(m=>{ const vs=voteSummary(m);
    ['A','B'].forEach(k=>{ const t=k==='A'?m.teamA:m.teamB, r=resOf(m,k);
      t.players.forEach(e=>{ if(isGuest(e.id)) return; const s=g(e.id); s.p++; s[{W:'w',D:'d',L:'l'}[r]]++; s.pts+={W:3,D:1,L:0}[r];
        s.goals+=statOf(m,'goals',e.id); s.assists+=statOf(m,'assists',e.id); if(vs.mvp===e.id) s.mvp++;
        const rr=vs.ratings[e.id]; if(rr){ s.rs+=rr.avg; s.rn++; } });
      const ids=t.players.map(e=>e.id).filter(id=>!isGuest(id)).sort();
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ const key=ids[i]+'|'+ids[j]; const o=pairs[key]||(pairs[key]={a:ids[i],b:ids[j],n:0,w:0,d:0,l:0}); o.n++; o[{W:'w',D:'d',L:'l'}[r]]++; }
    }); });
  const rows=Object.values(st).map(s=>Object.assign(s,{name:nameOf(s.id),rating:s.rn?s.rs/s.rn:null,wr:s.p?s.w/s.p:0}));
  return {ms,rows,pairs:Object.values(pairs).map(o=>Object.assign(o,{wr:o.n?(o.w+o.d*.5)/o.n:0}))};
}

function rsvpLists(date){
  const r=S.rsvp[date]||{}; const ent=Object.entries(r).filter(([id])=>getP(id)).map(([id,o])=>({id,...o}));
  const yes=ent.filter(x=>x.s==='yes').sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const T=icTotal(date);
  return {squad:yes.slice(0,T),bench:yes.slice(T),maybe:ent.filter(x=>x.s==='maybe'),no:ent.filter(x=>x.s==='no'),
    none:S.players.filter(p=>!r[p.id]).map(p=>({id:p.id})),total:ent.length};
}
function applyRsvpToDraft(){
  if(S.draft.auto===false) return false;
  const L=rsvpLists(S.draft.date); if(!L.squad.length) return false;
  const gs=draftGuests().map(g=>g.id).filter(id=>S.draft.selected.includes(id));
  const ids=L.squad.slice(0,Math.max(0,icTotal(S.draft.date)-gs.length)).map(x=>x.id).concat(gs); if(ids.join()===S.draft.selected.join()) return false;
  S.draft.selected=ids; return true;
}
function rsvpSet(s){
  const me=getMe(), date=UI.rsvpDate||S.draft.date; if(!me) return;
  const r=S.rsvp[date]||(S.rsvp[date]={}); const prev=r[me]; const now=new Date().toISOString();
  const at=(s==='yes'&&(!prev||prev.s!=='yes'))||!prev?now:prev.at;   // "geliyorum"a geçen sıranın sonuna yazılır
  r[me]={s,at};
  if(date===S.draft.date) applyRsvpToDraft();
  persist(); cloud(()=>Cloud.upsert('rsvp',[{group_id:G.id,match_date:date,player_id:me,status:s,created_at:at,updated_at:now}],'group_id,match_date,player_id'));

  rsvpModal(date); if(UI.view==='mac') refreshMatch();
}

function allFormations(n){ const of=n-1, out=[]; const min=of>=3?1:0;

/* Düzenleyicide sürükle-bırak */
let FXD=null;
function fxDrop(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const t=el.closest('.fx-pitch .tok[data-fid], .fx-bench .bchip[data-fid]'); if(t&&t.dataset.fid!==FXD.id) return {type:'swap',el:t,id:t.dataset.fid};
  const pitch=el.closest('.fx-pitch'); if(pitch){ const r=pitch.getBoundingClientRect(); const px=(x-r.left)/r.width*100, py=(y-r.top)/r.height*100;
    const Y=LINE_Y('single'); const role=ROLES.reduce((b,rl)=>Math.abs(Y[rl]-py)<Math.abs(Y[b]-py)?rl:b,'GK'); return {type:'pitch',el:pitch,role,px:clamp(px,4,96),ly:Y[role]}; }
  const bench=el.closest('.fx-bench'); if(bench) return {type:'bench',el:bench};
  return null;
}
function fxApplyDrop(id,t){
  const L=UI.fx.lineup; const si=L.starters.findIndex(e=>e.id===id); const isStarter=si>=0;
  const Y=LINE_Y('single');
  if(t.type==='swap'){
    const tj=L.starters.findIndex(e=>e.id===t.id);
    if(isStarter&&tj>=0){ const a=L.starters[si], b=L.starters[tj]; [a.role,b.role]=[b.role,a.role]; [a.slot,b.slot]=[b.slot,a.slot]; }
    else if(isStarter&&tj<0){ L.subs=L.subs.map(x=>x===t.id?id:x); L.starters[si]={id:t.id,role:L.starters[si].role,slot:L.starters[si].slot}; }
    else if(!isStarter&&tj>=0){ L.subs=L.subs.map(x=>x===id?t.id:x); L.starters[tj]={id,role:L.starters[tj].role,slot:L.starters[tj].slot}; }
    else return;
  } else if(t.type==='bench'){ if(!isStarter) return; L.starters.splice(si,1); L.subs.push(id); }
  else if(t.type==='pitch'){
    let e; if(isStarter) e=L.starters[si]; else { if(L.starters.length>=(L.size||7)){ toast(`Sahada zaten ${L.size||7} oyuncu var; bir oyuncunun üstüne bırakarak değiştirin`,'err'); return; } L.subs=L.subs.filter(x=>x!==id); e={id,role:t.role}; L.starters.push(e); }
    if(t.role==='GK'){ const gk=L.starters.find(o=>o.role==='GK'&&o.id!==id); if(gk){ gk.role=isStarter&&e.role!=='GK'?e.role:'DEF'; delete gk.slot; } }
    e.role=t.role;
    const xs=Object.fromEntries(tokenPositions({players:L.starters},'bottom','single').map(o=>[o.e.id,o.x])); xs[id]=t.px;
    L.starters.filter(o=>o.role===t.role).sort((a,b)=>xs[a.id]-xs[b.id]).forEach((o,i)=>o.slot=i);
  }
  L.formation=fxFormation(L); UI.fxDirty=true; render();
}
document.addEventListener('pointerdown',e=>{
  if(UI.view!=='t-mac'||!UI.fx||e.button>0) return;
  const src=e.target.closest('.fx-pitch .tok[data-fid], .fx-bench .bchip[data-fid]'); if(!src) return;
  FXD={id:src.dataset.fid,src,x0:e.clientX,y0:e.clientY,on:false};
});
document.addEventListener('pointermove',e=>{
  if(!FXD) return;
  if(!FXD.on){ if(Math.hypot(e.clientX-FXD.x0,e.clientY-FXD.y0)<7) return;
    FXD.on=true; document.body.classList.add('dnd'); FXD.src.classList.add('dragging');
    const p=teamPlayer({id:FXD.id}); const g=document.createElement('div'); g.className='dnd-ghost A'; g.innerHTML=`<div class="disc">${getP(FXD.id)?overallOf(getP(FXD.id)):''}</div><div class="lbl">${esc(shortName(p.name||nameOf(FXD.id)))}</div>`; document.body.appendChild(g); FXD.ghost=g; }
  e.preventDefault(); FXD.ghost.style.left=e.clientX+'px'; FXD.ghost.style.top=e.clientY+'px';
  document.querySelectorAll('.dropt').forEach(x=>x.classList.remove('dropt'));
  const t=fxDrop(e.clientX,e.clientY); let line=document.querySelector('.fx-pitch .dropline');
  if(t&&t.type==='pitch'){ if(!line){line=document.createElement('div');t.el.appendChild(line);} line.className='dropline A'; line.style.top=t.ly+'%'; line.innerHTML=`<span>${ROLE_TR[t.role]}</span>`; }
  else { line&&line.remove(); if(t) t.el.classList.add('dropt'); }
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!FXD) return; const d=FXD; FXD=null;
  d.ghost&&d.ghost.remove(); d.src.classList.remove('dragging'); document.body.classList.remove('dnd');
  document.querySelectorAll('.dropt').forEach(x=>x.classList.remove('dropt')); document.querySelectorAll('.dropline').forEach(x=>x.remove());
  if(!d.on) return; UI.noClick=true; setTimeout(()=>UI.noClick=false,60);
  FXD={id:d.id}; const t=fxDrop(e.clientX,e.clientY); FXD=null; if(t) fxApplyDrop(d.id,t);
});

  S.players.push(p);
  if(link){
    const swap=o=>{ if(o&&Object.prototype.hasOwnProperty.call(o,gid)){ o[nid]=o[gid]; delete o[gid]; } };
    [m.teamA,m.teamB].forEach(t=>t.players.forEach(x=>{ if(x.id===gid){ x.id=nid; x.snap=snap(p); } }));
    m.playerIds=m.playerIds.map(x=>x===gid?nid:x);
    if(m.stats){ swap(m.stats.goals); swap(m.stats.assists); }
    if(S.attendance[m.date]) S.attendance[m.date]=S.attendance[m.date].map(x=>x===gid?nid:x);
    if(S.current&&S.current.matchId===m.id){ [S.current.teamA,S.current.teamB].forEach(t=>t.players.forEach(x=>{ if(x.id===gid) x.id=nid; })); S.current.playerIds=S.current.playerIds.map(x=>x===gid?nid:x); }
    S.draft.selected=S.draft.selected.map(x=>x===gid?nid:x);
  } else { e.convertedTo=nid; }
  S.draft.guests=(S.draft.guests||[]).filter(g=>g.id!==gid);
  resetAI(); persist();
  cloud(async()=>{ await Cloud.upsert('players',[pToRow(p)]); await Cloud.upsert('matches',[mToRow(m)]); if(link&&S.attendance[m.date]) await Cloud.upsert('attendance',[attRow(m.date,S.attendance[m.date])],'group_id,match_date'); });
  closeModal(); render(); toast(`${name} kalıcı oyuncu oldu${link?' · maç kayıtları bağlandı':''}`,'ok');
}

function voteSave(){
  const V=UI.vote; if(!V||!V.me) return;
  delete V.ratings[V.me]; if(V.mvp===V.me) V.mvp=null;      // kendine oy verilemez
  const ratings=Object.fromEntries(Object.entries(V.ratings).filter(([id,v])=>+v>=1&&!isGuest(id)));
  if(!V.mvp&&!Object.keys(ratings).length){ toast('Maçın oyuncusunu seçin ya da puan verin','err'); return; }
  const now=new Date().toISOString();
  const v={matchId:V.mid,voterId:V.me,mvpId:V.mvp||null,ratings,updatedAt:now};
  const i=S.votes.findIndex(x=>x.matchId===v.matchId&&x.voterId===v.voterId); if(i>=0) S.votes[i]=Object.assign(S.votes[i],v); else S.votes.push(Object.assign({createdAt:now},v));
  setMe(V.me); resetAI(); persist();
  cloud(()=>Cloud.upsert('votes',[{group_id:G.id,match_id:v.matchId,voter_id:v.voterId,mvp_id:v.mvpId,ratings:v.ratings,updated_at:now}],'group_id,match_id,voter_id'));
  V.step=4; V.had=true; voteModal(V.mid,true); render();
}

function applyImport(txt){
  try{
    const d=JSON.parse(txt); if(!Array.isArray(d.players)) throw new Error('players bulunamadı');
    d.players.map(normPlayer).forEach(p=>{const i=S.players.findIndex(x=>x.id===p.id); if(i>=0) S.players[i]=p; else S.players.push(p);});
    (d.matches||[]).forEach(m=>{if(!S.matches.some(x=>x.id===m.id)) S.matches.push(m);});
    Object.assign(S.attendance,d.attendance||{});
    const nf=(d.fixtures||[]).filter(f=>!S.fixtures.some(x=>x.id===f.id)); S.fixtures.push(...nf);
    if(d.club&&!S.club.squad.length){ S.club=Object.assign({name:'',squad:[],data:{}},d.club); saveClub(); }
    if(nf.length) cloud(()=>Cloud.upsert('fixtures',nf.map(fxToRow)));
    resetAI(); persist(); closeModal(); render(); cloudPushAll(true);
    toast(`${d.players.length} oyuncu içe aktarıldı`,'ok');
  }catch(e){toast('Geçersiz dosya: '+e.message,'err');}
}
